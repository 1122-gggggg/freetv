name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, build, and test frontend
        working-directory: frontend
        run: npm ci && npm run lint && npm run build && npm test
      - name: Upload production frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Typecheck and test mobile client
        run: npm ci && npm run typecheck && npm test -- --runInBand

  backend:
    name: Backend and startup tests
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download production frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Run Pester startup tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.0 -Force -ErrorAction Stop
          $result = Invoke-Pester -Path ./scripts/tests/startup.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester startup test(s) failed."
          }

  package:
    name: Package appliance
    needs: [frontend, backend, mobile]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download production frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
      - name: Build appliance zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw -LiteralPath ./VERSION).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match VERSION $version."
          }
          ./scripts/package.ps1 -OutputPath ./pc-tv-box.zip
          $hash = (Get-FileHash -LiteralPath ./pc-tv-box.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'pc-tv-box.zip.sha256'),
            "$hash  pc-tv-box.zip`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          $manifest = [ordered]@{
            version = $version
            tag = $env:GITHUB_REF_NAME
            asset = 'pc-tv-box.zip'
            sha256 = $hash
            size = (Get-Item -LiteralPath ./pc-tv-box.zip).Length
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'release-manifest.json'),
            $manifest,
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build-installer.ps1 `
            -PackagePath ./pc-tv-box.zip `
            -OutputPath ./FreeTV-Setup.exe
          $hash = (Get-FileHash -LiteralPath ./FreeTV-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'FreeTV-Setup.exe.sha256'),
            "$hash  FreeTV-Setup.exe`n",
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Upload appliance zip
        uses: actions/upload-artifact@v7
        with:
          name: pc-tv-box-${{ github.sha }}
          path: |
            pc-tv-box.zip
            pc-tv-box.zip.sha256
            release-manifest.json
            Install-FreeTV.cmd
            Install-FreeTV.ps1
            FreeTV-Setup.exe
            FreeTV-Setup.exe.sha256
            install.sh
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke-test packaged appliance
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      APPLIANCE_ROOT: ${{ github.workspace }}\appliance\pc-tv-box
      APPLIANCE_PORT: '8765'
    steps:
      - name: Download appliance zip
        uses: actions/download-artifact@v8
        with:
          name: pc-tv-box-${{ github.sha }}
          path: release-artifact
      - name: Unpack appliance zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath ./release-artifact/pc-tv-box.zip -DestinationPath ./appliance
          if (-not (Test-Path -LiteralPath "$env:APPLIANCE_ROOT\scripts\setup.ps1")) {
            throw 'The appliance archive does not contain scripts/setup.ps1.'
          }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: appliance/pc-tv-box/backend/requirements.txt
      - name: Set up packaged appliance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:APPLIANCE_ROOT
          & ./scripts/setup.ps1
      - name: Start packaged appliance and run integration smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Stop-ApplianceController {
            $rootPattern = [regex]::Escape($env:APPLIANCE_ROOT)
            $portPattern = [regex]::Escape($env:APPLIANCE_PORT)
            $processes = @(
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.CommandLine -and
                  $_.CommandLine -match $rootPattern -and
                  $_.CommandLine -match '(?i)(?:^|\s)-m\s+uvicorn\s+app\.main:app(?:\s|$)' -and
                  $_.CommandLine -match "(?i)--port\s+$portPattern(?:\s|$)"
                }
            )
            foreach ($process in $processes) {
              Write-Host "Stopping packaged controller process $($process.ProcessId)."
              Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

          try {
            Set-Location -LiteralPath $env:APPLIANCE_ROOT
            & ./scripts/start.ps1 -NoBrowser
            & ./.venv/Scripts/python.exe ./scripts/integration-smoke.py `
              --transport http `
              --port $env:APPLIANCE_PORT `
              --lan-ip 127.0.0.1
            if ($LASTEXITCODE -ne 0) {
              throw "HTTP integration smoke failed with exit code $LASTEXITCODE."
            }

            $settingsPath = (Resolve-Path ./config/settings.json).Path
            $settings = Get-Content -Raw -LiteralPath $settingsPath | ConvertFrom-Json
            $settings.server.transport = 'https'
            $settingsJson = $settings | ConvertTo-Json -Depth 20
            [System.IO.File]::WriteAllText(
              $settingsPath,
              $settingsJson,
              [System.Text.UTF8Encoding]::new($false)
            )
            & ./scripts/start.ps1 -NoBrowser -AllowLoopbackOnlyTlsForTesting
            & ./.venv/Scripts/python.exe ./scripts/integration-smoke.py `
              --transport https `
              --port $env:APPLIANCE_PORT `
              --lan-ip 127.0.0.1 `
              --ca-cert ./config/tls/pc-tv-box-local-ca.cer
            if ($LASTEXITCODE -ne 0) {
              throw "HTTPS integration smoke failed with exit code $LASTEXITCODE."
            }
          } finally {
            Stop-ApplianceController
          }
      - name: Clean up packaged controller
        if: ${{ always() }}
        shell: pwsh
        run: |
          $rootPattern = [regex]::Escape($env:APPLIANCE_ROOT)
          $portPattern = [regex]::Escape($env:APPLIANCE_PORT)
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.CommandLine -and
              $_.CommandLine -match $rootPattern -and
              $_.CommandLine -match '(?i)(?:^|\s)-m\s+uvicorn\s+app\.main:app(?:\s|$)' -and
              $_.CommandLine -match "(?i)--port\s+$portPattern(?:\s|$)"
            } |
            ForEach-Object {
              Write-Host "Stopping remaining packaged controller process $($_.ProcessId)."
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }

  installer-smoke:
    name: Smoke-test Windows installer
    needs: package
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: pc-tv-box-${{ github.sha }}
          path: release-artifact
      - name: Install and verify FreeTV
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./release-artifact/FreeTV-Setup.exe `
            /VERYSILENT `
            /SUPPRESSMSGBOXES `
            /NORESTART `
            /LOG=FreeTV-Setup.log
          if ($LASTEXITCODE -ne 0) {
            throw "FreeTV installer failed with exit code $LASTEXITCODE."
          }

          $installed = Join-Path $env:LOCALAPPDATA 'FreeTV'
          $python = Join-Path $installed '.venv\Scripts\python.exe'
          $smoke = Join-Path $installed 'scripts\integration-smoke.py'
          if (-not (Test-Path -LiteralPath $python) -or -not (Test-Path -LiteralPath $smoke)) {
            throw 'FreeTV installer did not create a runnable application.'
          }
          $task = Get-ScheduledTask -TaskName 'PC TV Box' -ErrorAction Stop
          if ($task.State -eq 'Disabled') {
            throw 'FreeTV autostart task is disabled.'
          }
          & $python $smoke --transport http --port 8765 --lan-ip 127.0.0.1
          if ($LASTEXITCODE -ne 0) {
            throw "Installed FreeTV integration smoke failed with exit code $LASTEXITCODE."
          }
      - name: Clean up installed FreeTV
        if: ${{ always() }}
        shell: pwsh
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'FreeTV'
          $rootPattern = [regex]::Escape($installed)
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.CommandLine -and
              $_.CommandLine -match $rootPattern
            } |
            ForEach-Object {
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }
          $uninstaller = Join-Path $installed 'unins000.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          }
          Get-ScheduledTask -TaskName 'PC TV Box' -ErrorAction SilentlyContinue |
            Unregister-ScheduledTask -Confirm:$false -ErrorAction SilentlyContinue

  publish:
    name: Publish GitHub Release
    needs: [smoke, installer-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified appliance zip
        uses: actions/download-artifact@v8
        with:
          name: pc-tv-box-${{ github.sha }}
          path: release-artifact
      - name: Verify tested tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')"
          read -r object_type object_sha <<< "$object"
          for _ in {1..10}; do
            if [[ "$object_type" == "commit" ]]; then
              break
            fi
            if [[ "$object_type" != "tag" ]]; then
              echo "Tag resolves to unsupported Git object type: $object_type" >&2
              exit 1
            fi
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object.type + " " + .object.sha')"
            read -r object_type object_sha <<< "$object"
          done
          if [[ "$object_type" != "commit" || "$object_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to publish: tag no longer targets the tested commit." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-artifact/pc-tv-box.zip \
            release-artifact/pc-tv-box.zip.sha256 \
            release-artifact/release-manifest.json \
            release-artifact/Install-FreeTV.cmd \
            release-artifact/Install-FreeTV.ps1 \
            release-artifact/FreeTV-Setup.exe \
            release-artifact/FreeTV-Setup.exe.sha256 \
            release-artifact/install.sh \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
