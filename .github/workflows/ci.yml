name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        run: npm run build
      - name: Test
        run: npm test
      - name: Upload production frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend and startup tests
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download production frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up appliance runtime
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Run backend tests
        working-directory: backend
        run: ../.venv/Scripts/python.exe -m pytest -q
      - name: Run Pester startup tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.0 -Force -ErrorAction Stop
          $result = Invoke-Pester -Path ./scripts/tests/startup.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester startup test(s) failed."
          }
      - name: Run controller integration smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Stop-OwnedController {
            $listener = Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -eq $listener) { return }

            Import-Module ./scripts/TVBox.Startup.psm1 -Force
            $process = Get-CimInstance Win32_Process -Filter "ProcessId = $($listener.OwningProcess)"
            $parent = Get-CimInstance Win32_Process -Filter "ProcessId = $($process.ParentProcessId)"
            $python = (Resolve-Path ./.venv/Scripts/python.exe).Path
            $basePython = Resolve-PythonBaseExecutable -PythonPath $python
            if (-not (Test-ControllerProcessTreeOwnership `
              -Process $process `
              -ParentProcess $parent `
              -PythonPath $python `
              -BasePythonPath $basePython `
              -Port 8765)) {
              $listenerCommandOwned = Test-ControllerCommandLineOwnership `
                -CommandLine ([string]$process.CommandLine) `
                -PythonPath $python `
                -BasePythonPath $basePython `
                -Port 8765
              $parentOwned = Test-ControllerProcessOwnership `
                -Process $parent -PythonPath $python -Port 8765
              $listenerExecutableName = [System.IO.Path]::GetFileName(
                [string]$process.ExecutablePath
              )
              $parentExecutableName = [System.IO.Path]::GetFileName(
                [string]$parent.ExecutablePath
              )
              Write-Warning -WarningAction Continue -Message (
                "Listener PID $($process.ProcessId) failed ownership: " +
                "parent_pid=$($process.ParentProcessId), " +
                "listener_exe=$listenerExecutableName, " +
                "parent_exe=$parentExecutableName, " +
                "listener_command_owned=$listenerCommandOwned, " +
                "parent_owned=$parentOwned."
              )
              throw 'Refusing to stop a controller process that is not owned by this checkout.'
            }
            Stop-Process -Id $process.ProcessId -Force -ErrorAction Stop
            $deadline = (Get-Date).AddSeconds(10)
            do {
              $remaining = Get-NetTCPConnection `
                -LocalPort 8765 `
                -State Listen `
                -ErrorAction SilentlyContinue |
                Where-Object { $_.OwningProcess -eq $process.ProcessId } |
                Select-Object -First 1
              if ($null -eq $remaining) { return }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            throw "Controller process $($process.ProcessId) did not release port 8765."
          }

          $smokeFailure = $null
          try {
            ./scripts/start.ps1 -NoBrowser
            & ./.venv/Scripts/python.exe ./scripts/integration-smoke.py `
              --transport http --port 8765 --lan-ip 127.0.0.1
            if ($LASTEXITCODE -ne 0) {
              throw "HTTP integration smoke failed with exit code $LASTEXITCODE."
            }

            $settingsPath = (Resolve-Path ./config/settings.json).Path
            $settings = Get-Content -Raw -LiteralPath $settingsPath | ConvertFrom-Json
            $settings.server.transport = 'https'
            $settingsJson = $settings | ConvertTo-Json -Depth 20
            [System.IO.File]::WriteAllText(
              $settingsPath,
              $settingsJson,
              [System.Text.UTF8Encoding]::new($false)
            )
            ./scripts/start.ps1 -NoBrowser -AllowLoopbackOnlyTlsForTesting
            & ./.venv/Scripts/python.exe ./scripts/integration-smoke.py `
              --transport https `
              --port 8765 `
              --lan-ip 127.0.0.1 `
              --ca-cert ./config/tls/pc-tv-box-local-ca.cer
            if ($LASTEXITCODE -ne 0) {
              throw "HTTPS integration smoke failed with exit code $LASTEXITCODE."
            }
          } catch {
            $smokeFailure = $_
            throw
          } finally {
            try {
              Stop-OwnedController
            } catch {
              if ($null -eq $smokeFailure) {
                throw
              }
              $cleanupMessage = ([string]$_.Exception.Message) -replace '[\r\n]+', ' '
              Write-Warning -WarningAction Continue -Message (
                "Controller cleanup also failed after the smoke failure: $cleanupMessage"
              )
            }
          }

  mobile:
    name: Mobile typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --runInBand
